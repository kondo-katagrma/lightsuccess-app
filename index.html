<style>

  .opt{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;font-family:inherit;color:var(--ink)}

  .lvopt.sel{border-color:var(--deep);background:var(--mist)}

  .lvopt .ld{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
  select.month,input.txt{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}

  .btn{font-family:inherit;font-size:14px;font-weight:700;padding:11px 22px;border-radius:10px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);transition:all .15s}

  .tdraft{font-size:11.5px;color:var(--amber);background:var(--amberbg);border:1px solid #FAC775;border-radius:8px;padding:8px 12px;margin-top:14px;line-height:1.5}
  .qitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--soft)}
  .qcat{font-size:12.5px;font-weight:700;color:var(--deep)}

  #tmodal .modalbox{max-height:88vh;overflow:auto}
</style>
</head>

function canChooseCycle(f,level){

}
function resolveMendanIkusei(level,cycle){
  if(level==="初級者")return MENDAN_IKUSEI.shokyu;

}
function resolveSelfeval(level,cycle){
  if(level==="初級者")return SELFEVAL.hanki;

}
function resolveGoal(level,cycle){
  if(level==="初級者")return GOAL.ichinen;
  return cycle==="学期"?GOAL.gakki:GOAL.hanki;
}

const state={phase:"start",step:0,focuses:[],levels:{},cycle:null,month:null,hojin:"",author:"",date:"",memo:"",savedId:""};

/* ===== 状態に依存しないプラン計算（保存レコードの再表示にも使う） ===== */
function effectiveFocuses(focuses){
  const top=focuses.find(f=>MENDAN_FOCUSES.includes(f));
  return focuses.filter(f=>!MENDAN_FOCUSES.includes(f)||f===top);
}
function needCycle(){
  const eff=effectiveFocuses(state.focuses);
  return eff.some(f=>canChooseCycle(f,state.levels[f]));
}
function levelFocuses(){
  const eff=effectiveFocuses(state.focuses);
  return eff.filter(f=>["育成","評価","目標"].includes(f));
}
function stepList(){
  const steps=["focus"];
  if(levelFocuses().length>0)steps.push("level");
  if(needCycle())steps.push("cycle");

}
function renderSteps(){

}
function render(){
  if(state.phase==="start")return renderStart();
  renderSteps();
  const steps=stepList();
  const cur=steps[state.step];
  if(cur==="focus")return renderFocus();
  if(cur==="level")return renderLevel();
  if(cur==="cycle")return renderCycle();
  if(cur==="month")return renderMonth();
  return renderResult();
}

function wireNav(on){document.getElementById("nextbtn").onclick=on;const bb=document.getElementById("backbtn");if(bb)bb.onclick=()=>{state.step--;render();};}
function isLastStep(){return state.step===stepList().length-1;}

function fyIndex(m){return (m-4+12)%12;}
function monthDist(a,b){return Math.abs(fyIndex(a)-fyIndex(b));}
function buildPlan(st){
  const focuses=st.focuses,levels=st.levels,cycle=st.cycle;
  const top=focuses.find(f=>MENDAN_FOCUSES.includes(f));
  const eff=effectiveFocuses(focuses);
  const goalUsed=eff.includes("目標");
  const ikuseiLevel=levels["育成"];
  const ikuseiCycleAble=eff.includes("育成")&&canChooseCycle("育成",ikuseiLevel);
  let items=[];
  eff.forEach((f,pri)=>{
    const fn=funcOf(f);let sched=[];
    if(f==="育成")sched=resolveMendanIkusei(ikuseiLevel,cycle);
    else if(f==="モチベーション")sched=MENDAN_MOTIV;
    else if(f==="困りごと")sched=MENDAN_KOMARI;
    else if(f==="評価")sched=resolveSelfeval(levels["評価"],cycle);
    else if(f==="目標")sched=resolveGoal(levels["目標"],cycle);
    sched.forEach(it=>{
      let tmpl=it.template,alsoGoal=false;
      if(f==="育成"&&it.goalM&&goalUsed){tmpl="【目標】設定・振り返り（目標計画・管理対応）";alsoGoal=true;}
      items.push({m:it.m,title:it.title,desc:it.desc,template:tmpl,func:fn,focus:f,pri,alsoGoal});
    });
  });
  const special=eff.includes("育成")&&goalUsed&&ikuseiCycleAble;
  if(special)items=items.filter(it=>it.func!=="目標管理");
  const groups=[];
  items.forEach(it=>{let g=groups.find(g=>g.template===it.template&&g.func===it.func&&g.members.some(mm=>monthDist(mm.m,it.m)<=2));if(g)g.members.push(it);else groups.push({template:it.template,func:it.func,members:[it]});});
  let merged=groups.map(g=>{const best=g.members.slice().sort((a,b)=>a.pri-b.pri||a.m-b.m)[0];return{m:best.m,title:best.title,desc:best.desc,template:g.template,func:g.func,pri:Math.min(...g.members.map(x=>x.pri)),alsoGoal:g.members.some(x=>x.alsoGoal)};});
  merged.sort((a,b)=>a.m-b.m);
  merged.eff=eff;merged.dropped=focuses.filter(f=>MENDAN_FOCUSES.includes(f)&&f!==top);
  return merged;
}
function funcClassMap(plan){const order=[...new Set(plan.map(p=>p.func))];const map={};order.forEach((f,i)=>map[f]="f"+Math.min(i,2));return map;}
function funcOrder(f){const o={"自己評価":0,"目標管理":1,"面談":2};return o[f]!==undefined?o[f]:9;}

/* プラン本体のHTML（状態オブジェクトを渡す）。live時は診断結果、それ以外は再表示用 */
function planMarkup(st){
  const plan=buildPlan(st),startM=st.month,fmap=funcClassMap(plan);
  function offset(m){return ((m-startM)+12)%12;}
  const inWindow=(m)=>offset(m)<6;
  const windowItems=plan.filter(it=>inWindow(it.m)).slice().sort((a,b)=>offset(a.m)-offset(b.m)||funcOrder(a.func)-funcOrder(b.func)||a.pri-b.pri);
  const windowLast=MONTHS[((startM-1+5)%12)];
  const byMonth={};plan.forEach(it=>{(byMonth[it.m]=byMonth[it.m]||[]).push(it);});
  let rows="";
  for(let i=0;i<12;i++){
    const m=((4-1+i)%12)+1,arr=byMonth[m];if(!arr)continue;
    arr.sort((a,b)=>funcOrder(a.func)-funcOrder(b.func)||a.pri-b.pri);
    const isWin=inWindow(m);
    const inner=arr.map(it=>`<div class="titem"><span class="tfunc ${fmap[it.func]}">${it.func}</span>${it.alsoGoal?'<span class="tfunc f2">目標管理</span>':''}<span class="tt">${it.title}</span>${isWin?'<span class="firstflag">半年で実施</span>':''}<div class="td">${it.desc||""}</div><div class="ttemp clk" data-tmpl="${esc(it.template)}" title="クリックでテンプレの中身を表示">${it.template} ▸</div></div>`).join("");
    rows+=`<div class="trow ${isWin?"isfirst":""}"><div class="tmonth">${MONTHS[m-1]}</div><div class="tbody">${inner}</div></div>`;
  }
  const badges=plan.eff.map((f,i)=>`<span class="badge seg">${i+1}. ${f}</span>`).join("")
    +(st.cycle?`<span class="badge lvl">振り返り：${st.cycle}ごと</span>`:"");
  const dropNote=(plan.dropped&&plan.dropped.length)?`<div class="note">面談は年間の流れを一貫させるため、優先順位が最も高い「${plan.eff.find(f=>MENDAN_FOCUSES.includes(f))}」の面談プランのみを反映しています（「${plan.dropped.join("・")}」の面談は今回は非採用）。自己評価・目標管理は別機能として併存します。</div>`:"";
  let firstHtml;
  if(windowItems.length){
    const list=windowItems.map(it=>`<div class="witem"><div class="wmonth">${MONTHS[it.m-1]}</div><div class="wbody"><div class="wtitle"><span class="tfunc ${fmap[it.func]}">${it.func}</span>${it.alsoGoal?'<span class="tfunc f2">目標管理</span>':''}${it.title}</div><div class="wtemp clk" data-tmpl="${esc(it.template)}" title="クリックでテンプレの中身を表示">テンプレ：${it.template} ▸</div></div></div>`).join("");
    firstHtml=`<div class="section-t">半年で実施すること（契約開始 ${MONTHS[startM-1]} 〜 ${windowLast}）</div><div class="first"><div class="ft">この半年で計画されている項目</div><div class="wlist">${list}</div></div>`;
  }else{
    firstHtml=`<div class="section-t">半年で実施すること（契約開始 ${MONTHS[startM-1]} 〜 ${windowLast}）</div><div class="special"><div class="st">開始月＋6ヶ月以内に、実施タイミングがありません</div><div class="sd">${MONTHS[startM-1]}〜${windowLast}に実施予定がありません。(1)時期が来る次の実施を起点に、待つ間の段取りを進める、(2)時期非依存で着手できる機能を先に始める、のいずれかをCS判断で調整してください。</div></div>`;
  }
  const hasSelfeval=plan.some(p=>p.func==="自己評価");
  return `<div class="result-head"><div class="rlabel">診断結果</div><h2>選んだ観点を統合した年間マネジメントプラン</h2><div class="rsub">契約開始月（${MONTHS[startM-1]}）を起点に、半年（〜${windowLast}）で実施する項目がライトサクセスの対象です。重複する面談・テンプレは1つにまとめています。</div><div>${badges}</div></div>${firstHtml}<div class="section-t">1年間のマネジメントプラン（統合）</div>${dropNote}<div class="timeline">${rows}</div><div class="legend">${[...new Set(plan.map(p=>p.func))].map(f=>`<span><span class="tfunc ${fmap[f]}">${f}</span></span>`).join("")}</div>${hasSelfeval?`<div class="note">${SELFEVAL_TEMPLATE_NOTE}</div>`:""}<div class="note">半年のライトサクセスは、この半年で計画されている項目を実施することがゴールです。達成後、次の半年で年間サイクル全体（＝マネジメントの習慣化）へ広げます。</div>`;
}

function focusesText(st){return st.focuses.map((f,i)=>`${i+1}.${f}`).join(" / ");}
function levelsText(st){const ks=Object.keys(st.levels);return ks.length?ks.map(k=>`${k}:${st.levels[k]}`).join(" / "):"—";}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function renderResult(){
  const steps=stepList();state.step=steps.length;renderSteps();[...stepsEl.children].forEach(d=>d.classList.add("done"));
  const savePanel=`
    <div class="save">
      <div class="stt">この結果を保存する</div>
      <div class="ssub">保存するとチームの共有台帳に1件追加され、「蓄積一覧・比較」タブから全員が閲覧できます。</div>
      <div class="frow">
        <div><label class="flab">法人名</label><input class="txt" id="sv-hojin" value="${esc(state.hojin)}"></div>
        <div><label class="flab">実施日</label><input class="txt" id="sv-date" type="date" value="${esc(state.date||todayStr())}"></div>
      </div>
      <div class="frow">
        <div><label class="flab">記入者（担当CS）</label><input class="txt" id="sv-author" value="${esc(state.author)}" placeholder="例：近藤"></div>
        <div></div>
      </div>
      <div style="margin-bottom:12px"><label class="flab">打合せメモ（この結果について話したこと・決めたこと）</label><textarea class="txt" id="sv-memo" placeholder="打合せ中に直接メモできます。保存すると診断結果と一緒に蓄積され、一覧からいつでも見返せます。">${esc(state.memo||"")}</textarea></div>
      <button class="btn primary" id="sv-btn">この結果を保存</button>
      <div class="savemsg" id="sv-msg"></div>
    </div>`;
  resultEl.innerHTML=planMarkup(state)+savePanel+`<div class="restart"><button class="btn" onclick="restart()">最初からやり直す</button></div>`;
  document.getElementById("sv-btn").onclick=saveCurrent;
  quizEl.classList.add("hidden");resultEl.classList.remove("hidden");
}
function restart(){state.phase="start";state.step=0;state.focuses=[];state.levels={};state.cycle=null;state.month=null;state.hojin="";state.memo="";state.savedId="";resultEl.classList.add("hidden");quizEl.classList.remove("hidden");render();}

/* ===================== 共有台帳（Apps Script/スプレッドシート）連携 ===================== */
function jsonp(params){
  return new Promise((resolve,reject)=>{
    if(!CONFIG.API_URL){reject(new Error("NO_API"));return;}
    const cb="__cb"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let done=false;
    const cleanup=()=>{try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();};
    window[cb]=(data)=>{done=true;resolve(data);cleanup();};
    s.onerror=()=>{if(!done){reject(new Error("NETWORK"));cleanup();}};
    const q=new URLSearchParams(Object.assign({},params,{callback:cb,token:CONFIG.TOKEN})).toString();
    s.src=CONFIG.API_URL+"?"+q;
    document.body.appendChild(s);
    setTimeout(()=>{if(!done){reject(new Error("TIMEOUT"));cleanup();}},15000);
  });
}
function saveCurrent(){
  const msg=document.getElementById("sv-msg");
  const hojin=document.getElementById("sv-hojin").value.trim();
  const date=document.getElementById("sv-date").value;
  const author=document.getElementById("sv-author").value.trim();
  const memo=document.getElementById("sv-memo").value;
  state.memo=memo;state.author=author;state.hojin=hojin;state.date=date;  // 再描画してもメモが消えないよう保持
  msg.className="savemsg";
  if(!hojin){msg.className="savemsg err";msg.textContent="法人名を入力してください。";return;}
  if(!CONFIG.API_URL){msg.className="savemsg info";msg.textContent="共有先が未設定です。README.md の手順どおり Apps Script をデプロイし、CONFIG.API_URL を設定してください。";return;}
  const payload=JSON.stringify({focuses:state.focuses,levels:state.levels,cycle:state.cycle,month:state.month});
  const btn=document.getElementById("sv-btn");btn.disabled=true;
  msg.className="savemsg info";msg.textContent=state.savedId?"更新中…":"保存中…";
  const fields={hojin,date,author,cycle:state.cycle||"",month:state.month,
                focusesText:focusesText(state),levelsText:levelsText(state),payload,memo};
  const params=state.savedId?Object.assign({action:"update",id:state.savedId},fields)
                            :Object.assign({action:"save",id:"r"+Date.now()+Math.floor(Math.random()*10000)},fields);
  jsonp(params)
    .then(res=>{
      if(res&&res.ok){
        if(!state.savedId){state.savedId=params.id;btn.textContent="メモを更新して保存";}
        msg.className="savemsg ok";
        msg.textContent="保存しました。このままメモを追記して「メモを更新して保存」もできます。一覧からも後で編集できます。";
        listCache=null;btn.disabled=false;
      }else{msg.className="savemsg err";msg.textContent="保存に失敗しました："+((res&&res.error)||"不明なエラー");btn.disabled=false;}
    })
    .catch(e=>{msg.className="savemsg err";msg.textContent="通信に失敗しました（"+e.message+"）。URL設定・デプロイ範囲を確認してください。";btn.disabled=false;});
}

/* ===================== 一覧・比較ビュー ===================== */
const listView=document.getElementById("list-view");
let listCache=null;
function showList(){
  if(!CONFIG.API_URL){
    listView.innerHTML=`<div class="card"><div class="qtitle">共有先が未設定です</div><div class="qhint">README.md の手順で Apps Script をデプロイし、index.html 冒頭の <b>CONFIG.API_URL</b> にウェブアプリURLを設定すると、ここに全法人の診断結果が一覧表示されます。</div></div>`;
    return;
  }
  if(listCache){renderList(listCache);return;}
  listView.innerHTML=`<div class="empty">読み込み中…</div>`;
  jsonp({action:"list"}).then(res=>{
    if(res&&res.ok){listCache=res.rows||[];renderList(listCache);}
    else listView.innerHTML=`<div class="empty">読み込みに失敗しました：${(res&&res.error)||"不明なエラー"}</div>`;
  }).catch(e=>{listView.innerHTML=`<div class="empty">通信に失敗しました（${e.message}）</div>`;});
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function renderList(rows){
  if(!rows.length){listView.innerHTML=`<div class="empty">まだ保存された診断はありません。<br>「診断する」タブで実施し、結果画面から保存してください。</div>`;return;}
  // 集計
  const focusCount={};rows.forEach(r=>{try{const p=JSON.parse(r.payload||"{}");(p.focuses||[]).forEach(f=>focusCount[f]=(focusCount[f]||0)+1);}catch(e){}});
  const maxF=Math.max(1,...Object.values(focusCount));
  const focusBars=Object.keys(focusCount).sort((a,b)=>focusCount[b]-focusCount[a]).map(f=>
    `<div class="sumbar"><span class="bl">${esc(f)}</span><span class="bt"><span style="width:${Math.round(focusCount[f]/maxF*100)}%"></span></span><span class="bn">${focusCount[f]}</span></div>`).join("");
  const monthCount={};rows.forEach(r=>{const m=r.month;if(m)monthCount[m]=(monthCount[m]||0)+1;});
  const maxM=Math.max(1,...Object.values(monthCount));
  const monthBars=Object.keys(monthCount).sort((a,b)=>a-b).map(m=>
    `<div class="sumbar"><span class="bl">${MONTHS[m-1]}</span><span class="bt"><span style="width:${Math.round(monthCount[m]/maxM*100)}%"></span></span><span class="bn">${monthCount[m]}</span></div>`).join("");

  const trs=rows.map((r,i)=>{
    const focusTags=String(r.focusesText||"").split(" / ").filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
    const dt=r.ts?String(r.ts).slice(0,10):"";
    const memo1=String(r.memo||"").replace(/\s+/g," ").trim();
    const memoCell=memo1?`<span class="memocell" title="${esc(r.memo)}">📝 ${esc(memo1)}</span>`:"—";
    return `<tr>
      <td class="hj">${esc(r.hojin)}</td>
      <td>${esc(r.date||dt)}</td>
      <td>${esc(r.author||"—")}</td>
      <td>${focusTags||"—"}</td>
      <td>${r.month?MONTHS[r.month-1]:"—"}</td>
      <td>${memoCell}</td>
      <td><button class="rowbtn" data-i="${i}">プラン・メモを表示</button></td>
    </tr>`;
  }).join("");

  listView.innerHTML=`
    <div class="listbar">
      <div class="lcount">保存件数：<b>${rows.length}</b> 件</div>
      <div><input class="txt searchbox" id="list-search" placeholder="法人名・記入者で絞り込み"></div>
      <button class="btn" id="list-reload">再読み込み</button>
    </div>
    <div class="sum">
      <div class="sumcard"><div class="sh">よく選ばれる観点</div>${focusBars||'<div class="qhint">—</div>'}</div>
      <div class="sumcard"><div class="sh">契約開始月の分布</div>${monthBars||'<div class="qhint">—</div>'}</div>
    </div>
    <div style="overflow-x:auto">
    <table class="rec">
      <thead><tr><th>法人名</th><th>実施日</th><th>記入者</th><th>観点</th><th>開始月</th><th>メモ</th><th></th></tr></thead>
      <tbody id="rec-body">${trs}</tbody>
    </table>
    </div>`;
  document.getElementById("list-reload").onclick=()=>{listCache=null;showList();};
  document.getElementById("list-search").oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll("#rec-body tr").forEach((tr,i)=>{
      const r=rows[i];const hay=((r.hojin||"")+" "+(r.author||"")).toLowerCase();
      tr.style.display=hay.includes(q)?"":"none";
    });
  };
  document.querySelectorAll(".rowbtn").forEach(b=>{b.onclick=()=>openPlan(rows[+b.dataset.i]);});
}
function openPlan(r){
  let st;
  try{const p=JSON.parse(r.payload||"{}");st={focuses:p.focuses||[],levels:p.levels||{},cycle:p.cycle||null,month:p.month};}
  catch(e){st=null;}
  const title=document.getElementById("modal-title");
  const body=document.getElementById("modal-body");
  title.textContent=(r.hojin||"法人")+"　のマネジメントプラン";
  const when=esc(r.date||(r.ts?String(r.ts).slice(0,10):""));
  const editable=!!r.id;
  const memoBlock=`<div class="memoblock">
    <div class="mt">打合せメモ（${when}${r.author?" ／ "+esc(r.author):""}）</div>
    <textarea class="txt" id="pm-memo" ${editable?"":"disabled"} placeholder="打合せの内容をここに記入・追記できます。">${esc(r.memo||"")}</textarea>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
      <button class="btn primary" id="pm-save" ${editable?"":"disabled"}>メモを保存（この行を上書き）</button>
      <span class="savemsg" id="pm-msg" style="margin:0;padding:6px 10px"></span>
    </div>
    ${editable?"":'<div class="qhint" style="margin-top:8px">この記録は旧バージョンで保存されたため後編集できません。新しく保存した記録から編集できます。</div>'}
  </div>`;
  const planHtml=(!st||!st.month)?`<div class="empty">このレコードには再表示用のデータがありません。</div>`:planMarkup(st);
  body.innerHTML=memoBlock+planHtml;
  if(editable){
    document.getElementById("pm-save").onclick=()=>{
      const m=document.getElementById("pm-msg");const val=document.getElementById("pm-memo").value;
      const b=document.getElementById("pm-save");b.disabled=true;
      m.className="savemsg info";m.textContent="保存中…";
      jsonp({action:"update",id:r.id,memo:val})
        .then(res=>{
          if(res&&res.ok){m.className="savemsg ok";m.textContent="更新しました。";r.memo=val;if(listCache)renderList(listCache);b.disabled=false;}
          else{m.className="savemsg err";m.textContent="失敗："+((res&&res.error)||"不明なエラー");b.disabled=false;}
        })
        .catch(e=>{m.className="savemsg err";m.textContent="通信失敗（"+e.message+"）";b.disabled=false;});
    };
  }
  document.getElementById("modal").classList.add("show");
}
document.getElementById("modal-close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")document.getElementById("modal").classList.remove("show");};

/* ===== テンプレート内容の表示 ===== */
function openTemplate(name){
  const t=TEMPLATES[name]||TEMPLATES[tmplBase(name)];
  const title=document.getElementById("tmodal-title");
  const body=document.getElementById("tmodal-body");
  title.textContent=name;
  if(!t){
    body.innerHTML=`<div class="tpurpose">このテンプレートの中身はまだ登録されていません。</div><div class="tdraft">index.html の <b>TEMPLATES</b> にこの名称の項目を追加すると、ここに内容が表示されます。</div>`;
  }else{
    let html=`<div class="tkind">${esc(t.kind||"")}</div><div class="tpurpose">${esc(t.purpose||"")}</div>`;
    if(t.items&&t.items.length){
      html+=`<div class="section-t" style="margin-top:4px">設問（${t.items.length}項目）</div>`;
      html+=t.items.map((it,i)=>`<div class="qitem"><div class="qcat">${i+1}. ${esc(it[0])}</div><div class="qq">${esc(it[1])}</div>${it[2]?`<div class="qa">${esc(it[2])}</div>`:""}</div>`).join("");
    }
    if(t.variants&&t.variants.length){
      html+=`<div class="section-t" style="margin-top:4px">テンプレートの種類</div>`;
      html+=`<ul class="titems">`+t.variants.map(v=>`<li>${esc(v)}</li>`).join("")+`</ul>`;
    }
    if(t.note)html+=`<div class="note">${esc(t.note)}</div>`;
    if(t.source)html+=`<a class="btn primary tsrc" href="${esc(t.source)}" target="_blank" rel="noopener">元のテンプレート（スプレッドシート）を開く ↗</a>`;
    body.innerHTML=html;
  }
  document.getElementById("tmodal").classList.add("show");
}
document.getElementById("tmodal-close").onclick=()=>document.getElementById("tmodal").classList.remove("show");
document.getElementById("tmodal").onclick=e=>{if(e.target.id==="tmodal")document.getElementById("tmodal").classList.remove("show");};
document.addEventListener("click",e=>{const el=e.target.closest&&e.target.closest("[data-tmpl]");if(el){openTemplate(el.getAttribute("data-tmpl"));}});

/* ===================== タブ切替 ===================== */
const tabDiag=document.getElementById("tab-diag"),tabList=document.getElementById("tab-list");
const diagView=document.getElementById("diag-view");
tabDiag.onclick=()=>{tabDiag.classList.add("active");tabList.classList.remove("active");diagView.classList.remove("hidden");listView.classList.add("hidden");};
tabList.onclick=()=>{tabList.classList.add("active");tabDiag.classList.remove("active");listView.classList.remove("hidden");diagView.classList.add("hidden");showList();};

render();                       // まず開始画面を出す（一覧は読み込み中表示）
fetchHojins().then(()=>{if(state.phase==="start")renderStart();});  // 法人一覧が来たら選択肢を反映
</script>
